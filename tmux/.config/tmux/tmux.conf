# Tweaks

set -g allow-passthrough on
set -g status-style bg=default
set -g mouse on
set -ga terminal-overrides ",*:RGB"
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Keybinds

# unbind C-b
# set -g prefix `
# bind ` send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

bind -n M-Left run "tmux select-window -p"
bind -n M-Right run "tmux select-window -n"
bind -n M-t new-window -c "#{pane_current_path}"

# Statusbar

set -g status-interval 1

set-option -g renumber-windows on

set -g window-status-format "#I:#W"
set -g window-status-current-format "#[fg=orange]#I#[default]:#W"
set -g window-status-current-style "bold"
set -g window-status-activity-style "fg=yellow,bold"
set -g window-status-bell-style "fg=red,bold"

set -g status-left "\[#[fg=green]#S#[default]\] "

set -g status-right "#(whoami)@#H"
