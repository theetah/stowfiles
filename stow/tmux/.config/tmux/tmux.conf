###########
## THEME ##
###########

BLACK="#171717"
DARK_BACKGROUND="#1f1f1f"
BACKGROUND="#242424"
DARK_GREY1="#2e2e2e"
DARK_GREY2="#474747"
LIGHT_GREY1="#676767"
LIGHT_GREY2="#b4b4b4"
TEXT="#cccccc"
RED="#ff7f7b"
ORANGE="#ffb961"
YELLOW="#ffd67c"
GREEN="#beda78"
CYAN="#a1e6e0"
BLUE="#90bee1"
LIGHT_BLUE="#bed6ff"
PURPLE="#efb3f7"
MAGENTA="#ff93b3"

############
## TWEAKS ##
############

# NOTE TO SELF: install ncurses-term for below line to work
set -g default-terminal "tmux-256color"
set -g status-position bottom
set -g xterm-keys on
set -g allow-passthrough on
set -g status-style bg=default
set -g mouse on
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set -g focus-events on
set -g history-limit 50000
set -g pane-base-index 1

###############
## VARIABLES ##
###############

set -g @config_path "~/.config/tmux"

##############
## KEYBINDS ##
##############

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n m-h run "tmux select-window -p"
bind -n m-l run "tmux select-window -n"
bind -n m-space new-window
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

###################
## WINDOW STATUS ##
###################

set -g status-interval 1
set -g monitor-activity on
set -g activity-action none
set -g renumber-windows on
set -g window-status-separator " "
set -g status-justify centre
set -g status-left-length 50
set -g status-bg "${DARK_GREY1}"

# CURRENT WINDOW STATUS
set -g window-status-current-format "\
#[fg=${TEXT},bg=${DARK_GREY2}]\
#(#{@config_path}/scripts/git_branch.lua #{pane_current_path} ' @%%s')\
#(#{@config_path}/scripts/git_status.lua #{pane_current_path} '[%%s]')\
#(#{@config_path}/scripts/window_status_icon.lua #{pane_current_command} ' %%s ')\
#{=20:pane_current_command} \
#[default]\
"

# INACTIVE WINDOW STATUS
set -g window-status-style "fg=${TEXT},bg=${DARK_BACKGROUND}"
set -g window-status-format "\
#[bg=${DARK_GREY1}]\
#(#{@config_path}/scripts/git_branch.lua #{pane_current_path} ' @%%s' \${DARK_GREY2})\
#(#{@config_path}/scripts/git_status.lua #{pane_current_path} '[%%s]' \${DARK_GREY2})\
#(#{@config_path}/scripts/window_status_icon.lua #{pane_current_command} ' %%s ')\
#{=20:pane_current_command} \
#[default]\
"

# WINDOW STATUS COLOR
set -g window-status-activity-style "fg=${YELLOW},bg=${DARK_BACKGROUND},bold"

# WINDOW ERROR COLOR
set -g window-status-bell-style "fg=${RED},bg=${DARK_BACKGROUND},bold"

###############
## STATUSBAR ##
###############

# LEFT STATUS
set -g status-left "\
#[fg=${TEXT},bg=${DARK_GREY2}]\
#(#{@config_path}/scripts/battery.lua ' %%s %%d%%%')\
#[default]\
#[fg=${TEXT},bg=${DARK_GREY2}]\
  \
%I:%M %p \
#[default]\
"

# RIGHT STATUS
set -g status-right "\
#[fg=${TEXT},bg=${DARK_GREY2}]\
 \
 \
#(whoami)@#H \
 \
#S \
#[default]\
"
